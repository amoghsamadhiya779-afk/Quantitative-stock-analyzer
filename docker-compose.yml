services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    ports:
      - "7860:7860"
    volumes:
      # Local datasets and trained models (run `git lfs pull` first for the models)
      - ./data:/app/data
      - ./mlops_artifacts:/app/mlops_artifacts
    restart: unless-stopped

  ui:
    build:
      context: .
      dockerfile: Dockerfile.ui
      args:
        # Called from the user's browser, not from inside the Docker network
        NEXT_PUBLIC_API_URL: http://localhost:7860
    ports:
      - "3000:3000"
    depends_on:
      - api
    restart: unless-stopped
