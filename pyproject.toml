[tool.ruff]
target-version = "py310"
extend-exclude = ["notebooks", "frontend"]

[tool.ruff.lint]
# Pyflakes (unused/undefined names) plus syntax-level errors. Kept deliberately narrow so
# CI failures point at real bugs rather than style; widen once the codebase is clean.
select = ["E9", "F"]

[tool.pytest.ini_options]
testpaths = ["tests"]
